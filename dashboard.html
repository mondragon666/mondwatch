<script>
/* ─── v15 · helpers de visualização ─── */
function mwSeriesVal(pt){ if(!pt) return NaN; var v = pt.p != null ? pt.p : (pt.pnl != null ? pt.pnl : pt.value); return parseFloat(v); }
function mwSeries(i, per){ var d = walletData[i]; var s = d && d.pnlSeries ? d.pnlSeries[per] : null; return Array.isArray(s) && s.length > 1 ? s : null; }
function mwDelta(i, per){ var s = mwSeries(i, per); if(!s) return null; var a = mwSeriesVal(s[0]), b = mwSeriesVal(s[s.length-1]); return (isNaN(a)||isNaN(b)) ? null : b - a; }
function mwDayPnl(i){ return mwDelta(i, "1D"); }

function mwStats(i){
  var d = walletData[i]; if(!d) return null;
  var rawPos = Array.isArray(d.positions) ? d.positions : [];
  var closed = Array.isArray(d.closed) ? d.closed : [];
  var ids = new Set(closed.map(function(p){ return p.conditionId; }).filter(Boolean));
  var pos = rawPos.filter(function(p){
    if (p.conditionId && ids.has(p.conditionId)) return false;
    var c = p.currPrice != null ? p.currPrice : (p.currentPrice != null ? p.currentPrice : null);
    if (c !== null && (parseFloat(c) || 0) >= 0.999) return false;
    return true;
  });
  var posVal = pos.reduce(function(a,p){ return a + (parseFloat(p.currentValue) || 0); }, 0);
  var onChain = typeof d.pusdBalance === "number" ? d.pusdBalance : 0;
  var apiCash = d.value ? (parseFloat(d.value.cashBalance) || parseFloat(d.value.availableBalance) || parseFloat(d.value.usdcBalance) || parseFloat(d.value.cash) || 0) : 0;
  var cash = onChain >= 0.01 ? onChain : apiCash;
  var cashSrc = onChain >= 0.01 ? "on-chain" : (apiCash > 0 ? "api" : "none");
  var total = posVal + cash;
  if (cash < 0.01 && d.value && d.value.value) { var av = parseFloat(d.value.value) || 0; if (av > posVal) total = av; }
  var lb = Array.isArray(d.leaderboard) ? d.leaderboard[0] : null;
  return { total: total, posVal: posVal, cash: cash, cashSrc: cashSrc,
    pnl: parseFloat((lb && lb.pnl) || 0), day: mwDayPnl(i),
    posCount: pos.filter(function(p){ return (parseFloat(p.currentValue) || 0) > 0.01; }).length };
}

function mwColor(n){ return n > 0 ? "var(--green)" : (n < 0 ? "var(--red)" : "var(--muted)"); }
function mwSigned(n, dec){ return (n >= 0 ? "+" : "") + fmt$(n, dec == null ? 2 : dec); }

function mwDayCell(i){
  var v = mwDayPnl(i);
  if (v === null) return '<span class="mw-na" title="série intradiária indisponível">—</span>';
  return '<span style="font-weight:700;color:' + mwColor(v) + '">' + (v >= 0 ? "▲ " : "▼ ") + mwSigned(v) + '</span>';
}

function mwPnlBar(pnl, max){
  var pct = Math.min(100, Math.abs(pnl) / (max || 1) * 100);
  return '<span class="mw-bar"><i style="width:' + pct.toFixed(1) + '%;background:' + mwColor(pnl) + '"></i></span>';
}

function mwSpark(i, per, w, hgt){
  per = per || "1W"; w = w || 84; hgt = hgt || 24;
  var s = mwSeries(i, per);
  if (!s) return '<span class="mw-na">—</span>';
  var vals = s.map(mwSeriesVal).filter(function(v){ return !isNaN(v); });
  if (vals.length < 2) return '<span class="mw-na">—</span>';
  var step = Math.max(1, Math.ceil(vals.length / 60));
  var pts = [];
  for (var k = 0; k < vals.length; k += step) pts.push(vals[k]);
  if (pts[pts.length-1] !== vals[vals.length-1]) pts.push(vals[vals.length-1]);
  var mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts), rg = (mx - mn) || 1;
  var d = pts.map(function(v, k){
    var x = (k / (pts.length - 1)) * w;
    var y = hgt - 2 - ((v - mn) / rg) * (hgt - 4);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  var delta = pts[pts.length-1] - pts[0];
  return '<svg class="mw-spark" width="' + w + '" height="' + hgt + '" viewBox="0 0 ' + w + ' ' + hgt + '" preserveAspectRatio="none">' +
         '<polyline fill="none" stroke="' + mwColor(delta) + '" stroke-width="1.3" points="' + d + '"></polyline></svg>';
}

/* ─── Faixa consolidada + abas ─── */
var _mwPrev = {};
function mwFlash(el){ if(!el) return; el.classList.remove("mw-flash"); void el.offsetWidth; el.classList.add("mw-flash"); }
function mwSet(id, txt, color){
  var el = document.getElementById(id); if(!el) return;
  if (el.textContent !== txt) { el.textContent = txt; mwFlash(el.parentElement); }
  if (color) el.style.color = color;
}
function mwUpdateGlobals(){
  var t = 0, c = 0, p = 0, pnl = 0, day = 0, dayOk = false, open = 0, missing = 0, loaded = 0;
  WALLETS.forEach(function(w, i){
    var s = mwStats(i);
    var tab = document.querySelector('.wtab[data-wallet="' + i + '"]');
    var box = null;
    if (tab) {
      box = tab.querySelector(".mw-tabval");
      if (!box) { box = document.createElement("span"); box.className = "mw-tabval"; tab.appendChild(box); }
    }
    if (!s) { if (box) box.innerHTML = ""; return; }
    loaded++; t += s.total; c += s.cash; p += s.posVal; pnl += s.pnl; open += s.posCount;
    if (s.cashSrc === "none") missing++;
    if (s.day !== null) { day += s.day; dayOk = true; }
    if (box) {
      var html = "<b>" + fmt$(s.total, 0) + "</b>";
      if (s.day !== null) html += '<em style="color:' + mwColor(s.day) + '">' + mwSigned(s.day, 0) + "</em>";
      if (box.innerHTML !== html) {
        box.innerHTML = html;
        if (_mwPrev[i] !== undefined && Math.abs(_mwPrev[i] - s.total) > 0.5) mwFlash(tab);
      }
      _mwPrev[i] = s.total;
    }
  });
  if (!loaded) return;
  mwSet("mwgTotal", fmt$(t));
  mwSet("mwgCash", fmt$(c));
  mwSet("mwgPos", fmt$(p));
  var ps = document.getElementById("mwgPosSub"); if (ps) ps.textContent = open + " abertas · " + (t > 0 ? (p / t * 100).toFixed(0) : 0) + "% exposto";
  mwSet("mwgDay", dayOk ? mwSigned(day) : "—", dayOk ? mwColor(day) : "var(--muted)");
  var ds = document.getElementById("mwgDaySub");
  if (ds) ds.textContent = dayOk && t > 0 ? (day >= 0 ? "+" : "") + (day / t * 100).toFixed(2) + "% · 24h" : "últimas 24h";
  mwSet("mwgPnl", mwSigned(pnl), mwColor(pnl));
  var st = document.getElementById("mwgStatus");
  if (st) {
    var parts = [];
    if (missing) parts.push('<span class="mw-warn">⚠ ' + missing + " wallet(s) sem saldo on-chain</span>");
    parts.push(loaded + "/" + WALLETS.length + " wallets · " + new Date().toLocaleTimeString("pt-BR"));
    st.innerHTML = parts.join('<span style="display:block;height:5px"></span>');
  }
}
setInterval(mwUpdateGlobals, 4000);
setTimeout(mwUpdateGlobals, 1500);
</script>

<script>
/* ═══ v16 · gráfico de PnL redesenhado ═══ */
function mwFmtAxis(v){
  var a = Math.abs(v);
  if (a >= 1000000) return (v<0?'-':'') + '$' + (a/1000000).toFixed(a/1000000 >= 10 ? 0 : 1) + 'M';
  if (a >= 1000)    return (v<0?'-':'') + '$' + (a/1000).toFixed(a/1000 >= 10 ? 0 : 1) + 'k';
  return (v<0?'-':'') + '$' + a.toFixed(a < 10 ? 2 : 0);
}
function mwFmtTime(t, period){
  var d = new Date(t < 1e12 ? t * 1000 : t);
  if (period === '1D') return d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  if (period === '1W') return d.toLocaleDateString('pt-BR', {weekday:'short'}).replace('.','') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit'}) + 'h';
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
}
function mwNiceTicks(min, max, n){
  var span = (max - min) || 1;
  var step = Math.pow(10, Math.floor(Math.log10(span / n)));
  var err = (span / n) / step;
  if (err >= 7.5) step *= 10; else if (err >= 3.5) step *= 5; else if (err >= 1.5) step *= 2;
  var out = [], v = Math.ceil(min / step) * step;
  for (; v <= max + step * 0.001 && out.length < 12; v += step) out.push(+v.toFixed(6));
  return out;
}
var _mwCharts = {};
function mwDrawChart(svg, series, opts){
  if (!svg) return;
  opts = opts || {};
  var host = svg.parentElement;
  if (svg.id) _mwCharts[svg.id] = { series: series, opts: opts };
  var W = Math.max(280, Math.round((host && host.clientWidth) || svg.clientWidth || 640));
  var H = opts.height || 150;
  var padL = opts.compact ? 6 : 52, padR = opts.compact ? 8 : 16;
  var padT = 12, padB = opts.compact ? 8 : 24;
  svg.removeAttribute('preserveAspectRatio');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('class', 'mw-chart');
  svg.style.height = H + 'px';
  svg.innerHTML = '';
  var NSU = 'http://www.w3.org/2000/svg';
  var mk = function(t, a){ var e = document.createElementNS(NSU, t); for (var k in a) e.setAttribute(k, a[k]); return e; };
  if (!Array.isArray(series) || series.length < 2) {
    var em = mk('text', {x: W/2, y: H/2, 'text-anchor':'middle', fill:'#5d6270', 'font-size':11, 'font-family':'IBM Plex Mono, monospace'});
    em.textContent = 'sem dados para este período'; svg.appendChild(em); return;
  }
  var xs = series.map(function(p){ return p.t; });
  var ys = series.map(function(p){ return p.p; });
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var dMin = Math.min.apply(null, ys), dMax = Math.max.apply(null, ys);
  var span = (dMax - dMin) || Math.max(1, Math.abs(dMax) * 0.02);
  var minY = dMin - span * 0.18, maxY = dMax + span * 0.18;
  if (dMin >= 0 && minY < 0) minY = Math.min(0, dMin - span * 0.08);
  var rgX = (maxX - minX) || 1, rgY = (maxY - minY) || 1;
  var sx = function(x){ return padL + ((x - minX) / rgX) * (W - padL - padR); };
  var sy = function(y){ return H - padB - ((y - minY) / rgY) * (H - padT - padB); };
  var delta = ys[ys.length-1] - ys[0];
  var col = delta >= 0 ? '#4fb286' : '#d1495b';
  if (!opts.compact) {
    mwNiceTicks(minY, maxY, 4).forEach(function(v){
      var y = sy(v);
      if (y < padT - 2 || y > H - padB + 2) return;
      var zero = Math.abs(v) < rgY * 0.0001;
      svg.appendChild(mk('line', {x1: padL, x2: W - padR, y1: y.toFixed(1), y2: y.toFixed(1),
        stroke: zero ? '#3a3f49' : '#1b1e24', 'stroke-width': 1, 'stroke-dasharray': zero ? '3 3' : ''}));
      var t = mk('text', {x: padL - 9, y: (y + 3.5).toFixed(1), 'text-anchor':'end', fill:'#4d525e', 'font-size':9, 'font-family':'IBM Plex Mono, monospace'});
      t.textContent = mwFmtAxis(v); svg.appendChild(t);
    });
    var n = W > 780 ? 5 : 3;
    for (var i = 0; i <= n; i++) {
      var tx = minX + (rgX * i / n), X = sx(tx);
      var lt = mk('text', {x: X.toFixed(1), y: H - 6, 'text-anchor': i === 0 ? 'start' : (i === n ? 'end' : 'middle'), fill:'#4d525e', 'font-size':9, 'font-family':'IBM Plex Mono, monospace'});
      lt.textContent = mwFmtTime(tx, opts.period); svg.appendChild(lt);
    }
  }
  var d = series.map(function(p, i){ return (i ? 'L' : 'M') + ' ' + sx(p.t).toFixed(1) + ' ' + sy(p.p).toFixed(1); }).join(' ');
  var gid = 'mwg-' + (svg.id || 'x') + '-' + (opts.period || '');
  var defs = mk('defs', {});
  var lg = mk('linearGradient', {id: gid, x1:'0', y1:'0', x2:'0', y2:'1'});
  lg.appendChild(mk('stop', {offset:'0%', 'stop-color': col, 'stop-opacity':'0.26'}));
  lg.appendChild(mk('stop', {offset:'100%', 'stop-color': col, 'stop-opacity':'0'}));
  defs.appendChild(lg); svg.appendChild(defs);
  var base = Math.min(H - padB, Math.max(padT, sy(Math.max(minY, Math.min(0, dMin)))));
  svg.appendChild(mk('path', {d: d + ' L ' + sx(xs[xs.length-1]).toFixed(1) + ' ' + base.toFixed(1) + ' L ' + sx(xs[0]).toFixed(1) + ' ' + base.toFixed(1) + ' Z', fill:'url(#'+gid+')'}));
  svg.appendChild(mk('path', {d: d, fill:'none', stroke: col, 'stroke-width': opts.compact ? 1.4 : 1.8, 'stroke-linejoin':'round', 'stroke-linecap':'round'}));
  svg.appendChild(mk('circle', {cx: sx(xs[xs.length-1]).toFixed(1), cy: sy(ys[ys.length-1]).toFixed(1), r: opts.compact ? 2.4 : 3.2, fill: col, stroke:'#0b0c0e', 'stroke-width':1.5}));
  if (opts.compact || !host) return;
  var cross = mk('line', {y1: padT, y2: H - padB, stroke:'#4d525e', 'stroke-width':1, 'stroke-dasharray':'2 3', opacity:0});
  var hdot = mk('circle', {r: 3.4, fill: col, stroke:'#0b0c0e', 'stroke-width': 1.5, opacity: 0});
  svg.appendChild(cross); svg.appendChild(hdot);
  if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
  var tip = host.querySelector('.mw-tip');
  if (!tip) { tip = document.createElement('div'); tip.className = 'mw-tip'; host.appendChild(tip); }
  svg.onmousemove = function(ev){
    var r = svg.getBoundingClientRect();
    var px = (ev.clientX - r.left) * (W / r.width);
    var tv = minX + ((px - padL) / (W - padL - padR)) * rgX;
    var best = 0, bd = Infinity;
    for (var k = 0; k < xs.length; k++) { var dd = Math.abs(xs[k] - tv); if (dd < bd) { bd = dd; best = k; } }
    var X = sx(xs[best]), Y = sy(ys[best]);
    cross.setAttribute('x1', X.toFixed(1)); cross.setAttribute('x2', X.toFixed(1)); cross.setAttribute('opacity', 1);
    hdot.setAttribute('cx', X.toFixed(1)); hdot.setAttribute('cy', Y.toFixed(1)); hdot.setAttribute('opacity', 1);
    tip.innerHTML = '<b style="color:' + (ys[best] >= 0 ? '#4fb286' : '#d1495b') + '">' + (ys[best] >= 0 ? '+' : '-') + '$' + Math.abs(ys[best]).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</b><span>' + mwFmtTime(xs[best], opts.period) + '</span>';
    tip.style.left = (X / W * r.width) + 'px';
    tip.style.top = (Y / H * r.height) + 'px';
    tip.style.opacity = 1;
  };
  svg.onmouseleave = function(){ cross.setAttribute('opacity', 0); hdot.setAttribute('opacity', 0); tip.style.opacity = 0; };
}
var _mwRz;
window.addEventListener('resize', function(){
  clearTimeout(_mwRz);
  _mwRz = setTimeout(function(){
    Object.keys(_mwCharts).forEach(function(id){
      var el = document.getElementById(id);
      if (el && el.isConnected) mwDrawChart(el, _mwCharts[id].series, _mwCharts[id].opts);
    });
  }, 160);
});
function mwSeriesOf(idx, period){
  var d = walletData[idx];
  return (d && d.pnlSeries && Array.isArray(d.pnlSeries[period])) ? d.pnlSeries[period] : [];
}
function drawPnlSvgChart(idx, period){
  var s = mwSeriesOf(idx, period);
  mwDrawChart(document.getElementById('pnl-svg-' + idx), s, {period: period, height: 168});
  mwUpdatePnlHeader(idx, s, period);
}
function drawOvChart(idx, period){
  mwDrawChart(document.getElementById('ov-svg-' + idx), mwSeriesOf(idx, period), {period: period, height: 96, compact: true});
}
function drawConsolidatedSvgChart(period){
  var s = aggregatePnlSeries(period);
  mwDrawChart(document.getElementById('pnl-svg-consolidated'), s, {period: period, height: 190});
  mwUpdatePnlHeader('consolidated', s, period);
}
function mwPortfolioTotal(){
  var t = 0;
  WALLETS.forEach(function(_, i){ var s = (typeof mwStats === 'function') ? mwStats(i) : null; if (s) t += s.total; });
  return Math.max(t, 0.01);
}
function mwUpdatePnlHeader(key, series, period){
  var pnlEl = document.getElementById('pnl-card-val-' + key);
  if (!pnlEl || !series || series.length < 2) return;
  var ys = series.map(function(p){ return p.p; });
  var delta = ys[ys.length-1] - ys[0];
  var pos = delta >= 0;
  var base = key === 'consolidated' ? mwPortfolioTotal() : 0;
  var pctTxt = '';
  if (base > 0.02) {
    var pct = (delta / Math.max(base - delta, 0.01)) * 100;
    pctTxt = ' <span style="font-size:18px;font-weight:500;letter-spacing:0;color:' + (pos ? 'var(--green)' : 'var(--red)') + '">(' + (pos ? '+' : '') + pct.toFixed(2) + '%)</span>';
  }
  pnlEl.innerHTML = (pos ? '+' : '-') + '$' + Math.abs(delta).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + pctTxt;
  pnlEl.className = 'pnl-card-value ' + (pos ? 'pos-green' : 'pos-red');
  var tri = document.getElementById('pnl-card-tri-' + key);
  if (tri) { tri.textContent = pos ? '▲' : '▼'; tri.className = 'pnl-triangle ' + (pos ? 'pos' : 'neg'); }
  var lbl = document.getElementById('pnl-card-lbl-' + key);
  if (lbl) {
    var L = {'1D':'Past Day','1W':'Past Week','1M':'Past Month','1Y':'Past Year','ALL':'All-Time'};
    lbl.textContent = 'Profit / Loss · ' + (L[period] || period);
  }
}
